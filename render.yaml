# Blueprint do Render — provisiona app + banco automaticamente.
# Você só conecta o repositório e o Render faz o resto.
services:
  - type: web
    name: sonar
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sonar-db
          property: connectionString
      - key: APP_URL
        value: https://sonar.onrender.com
      - key: NODE_VERSION
        value: 22.23.2
      - key: REGISTRATIONS_PER_HOUR
        value: "60"

databases:
  - name: sonar-db
    plan: free
    databaseName: sonar
